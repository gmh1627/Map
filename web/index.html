<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中国铁路图</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=1.9.4">
  <link rel="stylesheet" href="styles.css?v=20261115-3">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>中国铁路图</h1>
        <p id="status"></p>
      </div>
      <div class="topbar-actions">
        <a id="blogHome" class="button-link" href="https://kangaroogao.com/">返回主页</a>
        <button id="reset" type="button">重置视图</button>
      </div>
    </header>
    <section class="workspace">
      <aside class="panel" aria-label="图层控制">
        <section class="year-filter-section" aria-label="年份筛选">
          <div class="route-list-heading"><h2>行程年份</h2><span>可多选</span></div>
          <div id="yearFilters" class="year-filters" role="group" aria-label="选择行程年份">
            <button class="year-filter" type="button" data-year="all" aria-pressed="true">全部年份</button>
          </div>
        </section>
        <section class="map-summary" aria-label="铁路足迹统计">
          <div id="summaryLabel" class="summary-label">铁路足迹</div>
          <div class="summary-total"><strong id="summaryTrips">148</strong><span>段乘车记录</span></div>
          <div class="summary-counts">
            <div><strong id="summaryConventional">53</strong><span>普铁</span></div>
            <div><strong id="summaryHighspeed">95</strong><span>高铁 / 动车</span></div>
          </div>
          <div class="summary-mileage"><span>总里程</span><strong><span id="summaryDistance">62,666</span> <small>km</small></strong></div>
          <div class="summary-breakdown"><span>普铁 <span id="summaryConventionalKm">27,514</span> km</span><span>高铁 / 动车 <span id="summaryHighspeedKm">35,152</span> km</span></div>
            <div class="summary-foot"><strong id="summaryCities">76</strong> 个城市 <i>·</i> <strong id="summaryStations">144</strong> 座车站</div>
        </section>
        <section class="control-section">
          <h2>显示图层</h2>
          <div class="control-grid">
            <label class="switch"><input id="visited" type="checkbox" checked><span>铁路行程</span></label>
            <label class="switch"><input id="network" type="checkbox"><span>全国铁路底图</span></label>
            <label class="switch"><input id="visitedHighspeed" type="checkbox"><span>高铁 / 动车行程</span></label>
            <label class="switch"><input id="visitedConventional" type="checkbox"><span>普速铁路行程</span></label>
            <label class="switch"><input id="speedNetwork" type="checkbox"><span>按设计速度着色</span></label>
          </div>
        </section>
        <hr>
        <section class="control-section">
          <h2>地图要素</h2>
          <div class="control-grid">
            <label class="switch"><input id="cityBounds" type="checkbox" checked><span>地级市边界</span></label>
            <label class="switch"><input id="visitedCities" type="checkbox" checked><span>铁路到达城市</span></label>
            <label class="switch"><input id="otherVisitedCities" type="checkbox"><span>其他到访城市</span></label>
          </div>
        </section>
        <hr>
        <section class="hub-filter-section" aria-label="枢纽筛选">
          <div class="route-list-heading"><h2>线路范围</h2></div>
          <div id="hubFilters" class="hub-filters" role="group" aria-label="选择线路范围">
            <button class="hub-filter" type="button" data-hub="all" aria-pressed="true">全部</button>
            <button class="hub-filter" type="button" data-hub="beijing" aria-pressed="false">北京</button>
            <button class="hub-filter" type="button" data-hub="hefei" aria-pressed="false">合肥</button>
            <button class="hub-filter" type="button" data-hub="guangzhou" aria-pressed="false">广州</button>
          </div>
        </section>
        <div class="route-list-heading"><h2 id="routeListHeading">相关行程</h2></div>
        <input id="routeSearch" class="route-search" type="search" placeholder="搜索车次、起点或终点" autocomplete="off">
        <div class="route-actions"><button id="selectAllRoutes" type="button">全选</button><button id="clearRoutes" type="button">全不选</button></div>
        <div id="routeList" class="route-list" aria-label="铁路行程列表"></div>
        <div class="legend" id="legend"></div>
      </aside>
      <div class="map-stage">
        <div id="map" role="application" aria-label="中国铁路交互地图"></div>
      </div>
    </section>
  </main>
  <script src="vendor/leaflet/leaflet.js?v=1.9.4"></script>
  <script src="data-codec.js?v=175f5d0ab37d"></script>
  <script src="app.js?v=036e5671fbb4"></script>
</body>
</html>
