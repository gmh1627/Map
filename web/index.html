<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中国铁路图</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <link rel="stylesheet" href="styles.css?v=20260917-1">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>中国铁路图</h1>
        <p id="status"></p>
      </div>
      <div class="topbar-actions">
        <a class="button-link" href="hubs/">铁路枢纽图</a>
        <a id="blogHome" class="button-link" href="/" hidden>返回主页</a>
        <button id="reset" type="button">重置视图</button>
      </div>
    </header>
    <section class="workspace">
      <aside class="panel" aria-label="图层控制">
        <section class="map-summary" aria-label="铁路足迹统计">
          <div class="summary-label">铁路足迹</div>
          <div class="summary-total"><strong>137</strong><span>段乘车记录</span></div>
          <div class="summary-counts">
            <div><strong>45</strong><span>普铁</span></div>
            <div><strong>92</strong><span>高铁 / 动车</span></div>
          </div>
          <div class="summary-mileage"><span>总里程</span><strong>55,896 <small>km</small></strong></div>
          <div class="summary-breakdown"><span>普铁 22,472 km</span><span>高铁 / 动车 33,424 km</span></div>
          <div class="summary-foot"><strong>66</strong> 个城市 <i>·</i> <strong>132</strong> 座车站</div>
        </section>
        <section class="control-section">
          <h2>显示图层</h2>
          <div class="control-grid">
            <label class="switch"><input id="visited" type="checkbox" checked><span>铁路行程</span></label>
            <label class="switch"><input id="network" type="checkbox"><span>全国铁路底图</span></label>
            <label class="switch"><input id="visitedHighspeed" type="checkbox"><span>高铁 / 动车行程</span></label>
            <label class="switch"><input id="visitedConventional" type="checkbox"><span>普速铁路行程</span></label>
            <label class="switch"><input id="speedNetwork" type="checkbox"><span>按设计速度着色</span></label>
          </div>
        </section>
        <hr>
        <section class="control-section">
          <h2>地图要素</h2>
          <div class="control-grid">
            <label class="switch"><input id="cityBounds" type="checkbox" checked><span>地级市边界</span></label>
            <label class="switch"><input id="visitedCities" type="checkbox" checked><span>铁路到达城市</span></label>
            <label class="switch"><input id="otherVisitedCities" type="checkbox"><span>其他到访城市</span></label>
          </div>
        </section>
        <hr>
        <div class="route-list-heading"><h2>路线附表</h2></div>
        <input id="routeSearch" class="route-search" type="search" placeholder="搜索车次、起点或终点" autocomplete="off">
        <div class="route-actions"><button id="selectAllRoutes" type="button">全选</button><button id="clearRoutes" type="button">全不选</button></div>
        <div id="routeList" class="route-list" aria-label="铁路行程列表"></div>
        <div class="legend" id="legend"></div>
      </aside>
      <div class="map-stage">
        <div id="map" role="application" aria-label="中国铁路交互地图"></div>
      </div>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=20260917-1"></script>
</body>
</html>
